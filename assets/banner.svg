<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B"/>
      <stop offset="50%" style="stop-color:#312E81"/>
      <stop offset="100%" style="stop-color:#3730A3"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E0E7FF"/>
      <stop offset="100%" style="stop-color:#C7D2FE"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.05">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="200" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="200" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Shield logo -->
  <g transform="translate(40, 30)">
    <!-- Shield shape -->
    <path d="M60 8 L100 22 L100 50 C100 72 82 90 60 100 C38 90 20 72 20 50 L20 22 Z"
          fill="url(#shieldGrad)"
          stroke="#4338CA"
          stroke-width="2"/>

    <!-- Inner shield highlight -->
    <path d="M60 15 L93 27 L93 50 C93 68 78 83 60 92 C42 83 27 68 27 50 L27 27 Z"
          fill="none"
          stroke="rgba(255,255,255,0.2)"
          stroke-width="1"/>

    <!-- Key icon -->
    <g transform="translate(38, 30)">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#E0E7FF" stroke-width="2.5"/>
      <circle cx="12" cy="12" r="4" fill="#4F46E5"/>
      <rect x="19" y="10" width="16" height="4" rx="1.5" fill="#E0E7FF"/>
      <rect x="28" y="14" width="3" height="4" rx="0.5" fill="#E0E7FF"/>
      <rect x="33" y="14" width="3" height="6" rx="0.5" fill="#E0E7FF"/>
    </g>

    <!-- Checkmark badge -->
    <circle cx="85" cy="80" r="14" fill="url(#checkGrad)" stroke="#fff" stroke-width="2"/>
    <path d="M78 80 L82 84 L92 74" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title text -->
  <text x="190" y="85" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="url(#textGrad)">
    Crypto-Signed Approvals
  </text>

  <!-- Subtitle -->
  <text x="190" y="125" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#A5B4FC">
    Hardware wallet signatures for GitHub PR approvals
  </text>

  <!-- Feature pills -->
  <g transform="translate(190, 145)">
    <rect x="0" y="0" width="120" height="28" rx="14" fill="rgba(99, 102, 241, 0.3)" stroke="#6366F1" stroke-width="1"/>
    <text x="60" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C7D2FE" text-anchor="middle">ECDSA Signatures</text>

    <rect x="130" y="0" width="100" height="28" rx="14" fill="rgba(99, 102, 241, 0.3)" stroke="#6366F1" stroke-width="1"/>
    <text x="180" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#C7D2FE" text-anchor="middle">Multi-Sig M/N</text>

    <rect x="240" y="0" width="130" height="28" rx="14" fill="rgba(16, 185, 129, 0.3)" stroke="#10B981" stroke-width="1"/>
    <text x="305" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#6EE7B7" text-anchor="middle">Blockchain Canary</text>
  </g>
</svg>
