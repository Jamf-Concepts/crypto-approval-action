name: Test Action

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # This job tests the action on PRs with crypto approval comments
  test-crypto-approval:
    runs-on: ubuntu-latest
    # Only run on PR events or comments on PRs
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run bundle

      - name: Run crypto approval check
        id: crypto-approval
        uses: ./
        with:
          # Reads authorized signers from .github/KEYOWNERS
          min-approvals: '2'
          require-canary: 'true'
          canary-chain: 'ethereum'
          canary-rpc-url: ${{ secrets.CANARY_RPC_URL }}
          canary-min-balance: '1000000000000000'  # 0.001 ETH
          signature-max-age: '86400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail the workflow if no approval found

      - name: Report result
        run: |
          echo "Crypto approval valid: ${{ steps.crypto-approval.outputs.valid }}"
          echo "Signer: ${{ steps.crypto-approval.outputs.signer }}"
          echo "Canary balance: ${{ steps.crypto-approval.outputs.canary-balance }}"
