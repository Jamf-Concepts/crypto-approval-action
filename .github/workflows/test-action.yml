name: Test Action

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  # This job tests the action on PRs with crypto approval comments
  test-crypto-approval:
    runs-on: ubuntu-latest
    # Only run on PR events or comments on PRs
    if: github.event_name == 'pull_request' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install and build
        run: |
          npm ci
          npm run bundle

      - name: Run crypto approval check
        id: crypto-approval
        uses: ./
        with:
          # Allowed signer addresses - hardcoded intentionally for transparency
          # Anyone can verify which hardware wallets are authorized to approve PRs
          # Changes to this list are tracked in git history
          allowed-keys: '0x810a44040c66446C394b9dC09E80394C03ab90d2'
          require-canary: 'false'
          signature-max-age: '86400'
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true  # Don't fail the workflow if no approval found

      - name: Report result
        run: |
          echo "Crypto approval valid: ${{ steps.crypto-approval.outputs.valid }}"
          echo "Signer: ${{ steps.crypto-approval.outputs.signer }}"
          echo "Canary balance: ${{ steps.crypto-approval.outputs.canary-balance }}"

  # Integration test with mock signature (for CI testing)
  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm test -- --testPathPattern=integration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
